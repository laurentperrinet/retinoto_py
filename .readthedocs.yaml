# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Set the OS and Python version used to build docs on RTD servers.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Install our doc deps alongside the project so sphinx builds succeed.
python:
  install:
    - method: pip
      path: .                     # installs retinoto_py itself so autodoc can find it
    - requirements: docs/requirements.txt   # Sphinx + myst-nb + nbsphinx go here

# Tell RTD where conf.py sits — repo root (no docs/ subdir now).
sphinx:
  configuration: conf.py          # <-- repo-root Sphinx config replaces pelicanconf